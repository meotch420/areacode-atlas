<!DOCTYPE html>
<!-- html/VER.01 — World Clock, duplicates removed -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock / VER.01</title>
<style>
  /* === RESET === */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    font-family: Arial, sans-serif;
    padding: 10px;
  }

  /* === GRID === */
  .clock-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    background: #111;
    border-radius: 12px;
    padding: 8px;
  }

  /* === CARD === */
  .clock-card {
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }

  /* === ZONE LABEL (no duplicate subtitle) === */
  .clock-card .zone-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  /* === TIME DISPLAY === */
  .clock-card .time {
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="clock-grid" id="grid"></div>

<script>
/* === js/VER.01 — Zone data, no duplicate names === */
const zones = [
  { label: "Hawaii",             tz: "Pacific/Honolulu",        color: "#7c3aed" },
  { label: "Alaska",             tz: "America/Anchorage",       color: "#059669" },
  { label: "Pacific",            tz: "America/Los_Angeles",     color: "#dc2626" },
  { label: "Mountain",           tz: "America/Denver",          color: "#f59e0b" },
  { label: "Central",            tz: "America/Chicago",         color: "#0284c7" },
  { label: "Eastern",            tz: "America/New_York",        color: "#16a34a" },
  { label: "Atlantic",           tz: "America/Halifax",         color: "#d97706" },
  { label: "Newfoundland",       tz: "America/St_Johns",        color: "#7c3aed" },
  { label: "Brasília",           tz: "America/Sao_Paulo",       color: "#059669" },
  { label: "South Georgia",      tz: "Atlantic/South_Georgia",  color: "#dc2626" },
  { label: "Azores",             tz: "Atlantic/Azores",         color: "#6366f1" },
  { label: "Greenwich",          tz: "Etc/GMT",                 color: "#0f766e" },
  { label: "London",             tz: "Europe/London",           color: "#0284c7" },
  { label: "Central Europe",     tz: "Europe/Paris",            color: "#b45309" },
  { label: "Israel",             tz: "Asia/Jerusalem",          color: "#7c3aed" },
  { label: "Gulf",               tz: "Asia/Dubai",              color: "#d97706" },
  { label: "Pakistan",           tz: "Asia/Karachi",            color: "#16a34a" },
  { label: "Bangladesh",         tz: "Asia/Dhaka",              color: "#6366f1" },
  { label: "Indochina",          tz: "Asia/Bangkok",            color: "#0f766e" },
  { label: "China / Singapore",  tz: "Asia/Singapore",          color: "#dc2626" },
  { label: "Japan / Korea",      tz: "Asia/Tokyo",              color: "#7c3aed" },
  { label: "Australian Eastern", tz: "Australia/Sydney",        color: "#059669" },
  { label: "Solomon Islands",    tz: "Pacific/Guadalcanal",     color: "#0284c7" },
  { label: "New Zealand",        tz: "Pacific/Auckland",        color: "#dc2626" },
  { label: "Tonga",              tz: "Pacific/Tongatapu",       color: "#6366f1" },
  { label: "Line Islands",       tz: "Pacific/Kiritimati",      color: "#ca8a04" },
  { label: "Baker Island",       tz: "Etc/GMT+12",              color: "#16a34a" },
  { label: "Samoa",              tz: "Pacific/Apia",            color: "#7c3aed" },
];

/* === UTILITY: auto text contrast === */
function textColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 128 ? "#000" : "#fff";
}

/* === UTILITY: format time for timezone === */
function fmt(tz) {
  try {
    return new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    }).format(new Date());
  } catch (e) { return "--:--:--"; }
}

/* === BUILD CARDS === */
const grid = document.getElementById("grid");

zones.forEach(z => {
  const card = document.createElement("div");
  card.className = "clock-card";
  card.style.background = z.color;
  const tc = textColor(z.color);
  card.innerHTML = `
    <div class="zone-name" style="color:${tc}">${z.label}</div>
    <div class="time"      style="color:${tc}" data-tz="${z.tz}"></div>
  `;
  grid.appendChild(card);
});

/* === LIVE TICK === */
function tick() {
  document.querySelectorAll("[data-tz]").forEach(el => {
    el.textContent = fmt(el.dataset.tz);
  });
}
tick();
setInterval(tick, 1000);
</script>

</body>
</html>
