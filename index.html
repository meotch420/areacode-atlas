<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AreaCode Atlas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

 
<body>
  <div class="top-section">
    <header>
<h1>TEST BRANCH</h1>
      <p>Navigate North America by Area Code</p>
    </header>

    <form class="search" id="searchForm">
      <input
        id="areaSearch"
        type="text"
        placeholder="Enter Area Code (ex: 212)"
      />
      <button type="submit" id="searchBtn">Search</button>
    </form>
  </div>

  <div id="map"></div>

  <div id="infoPanel">
    <h3>Area Information</h3>

    <div id="info">
      <div class="info-row"><span class="label">City:</span> <span id="info-city">-</span></div>
      <div class="info-row"><span class="label">State:</span> <span id="info-state">-</span></div>
      <div class="info-row"><span class="label">Area Code:</span> <span id="info-area-code">-</span></div>
      <div class="info-row"><span class="label">Time Zone:</span> <span id="info-timezone">-</span></div>
      <div class="info-row"><span class="label">Business Hours:</span> <span id="info-hours">-</span></div>
    </div>

    <div id="clock">--:--:--</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="areacode.js"></script>
</body>
</html>
