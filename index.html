  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AreaCode Atlas</title>

    <link
      rel="stylesheet"
     href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
   />
  <link rel="stylesheet" href="styles.css" />
 </head>
 <body>
   <div class="top-section">
     <header>
       <h1>AreaCode Atlas</h1>
       <p>Navigate North America by Area Code</p>
     </header>

     <form class="search" id="searchForm">
       <input
         id="areaSearch"
         type="text"
         placeholder="Enter Area Code (ex: 212)"
       />
     <button type="submit" id="searchBtn">Search</button>
     </form>
   </div>

   <div id="map"></div>

  <div id="infoPanel">
  <h3>Area Information</h3>
  <p><strong>City:</strong> <span id="info-city">-</span></p>
  <p><strong>State:</strong> <span id="info-state">-</span></p>
  <p><strong>Area Code:</strong> <span id="info-area-code">-</span></p>
  <p><strong>Timezone:</strong> <span id="info-timezone">-</span></p>
  <p><strong>Business Hours:</strong> <span id="info-hours">-</span></p>
  <div id="clock"></div>
</div>

   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   <script src="areacode.js"></script>
 </body>
 </html>
