<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AreaCode Atlas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1a2b;
      color: white;
    }

    .top-section {
      padding: 16px;
      background: #08121f;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 4px 0 12px;
      color: #aaa;
    }

    .search {
      display: flex;
      gap: 10px;
    }

    .search input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      width: 200px;
    }

    .search button {
      padding: 10px 16px;
      font-size: 16px;
      background: #2a7fff;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    #map {
      height: 500px;
    }

    #infoPanel {
      position: absolute;
      top: 100px;
      right: 20px;
      background: linear-gradient(180deg, #0f2747 0%, #16365c 100%);
      padding: 22px 24px;
      border-radius: 16px;
      min-width: 280px;
      max-width: 320px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    #infoPanel h3 {
      margin: 0 0 18px 0;
      text-align: center;
      font-size: 30px;
      font-weight: 800;
    }

    .info-row {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .label {
      font-weight: 800;
      margin-right: 6px;
    }

    #clock {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      font-size: 26px;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div class="top-section">
    <header>
<h1>TEST BRANCH</h1>
      <p>Navigate North America by Area Code</p>
    </header>

    <form class="search" id="searchForm">
      <input
        id="areaSearch"
        type="text"
        placeholder="Enter Area Code (ex: 212)"
      />
      <button type="submit" id="searchBtn">Search</button>
    </form>
  </div>

  <div id="map"></div>

  <div id="infoPanel">
    <h3>Area Information</h3>

    <div id="info">
      <div class="info-row"><span class="label">City:</span> <span id="info-city">-</span></div>
      <div class="info-row"><span class="label">State:</span> <span id="info-state">-</span></div>
      <div class="info-row"><span class="label">Area Code:</span> <span id="info-area-code">-</span></div>
      <div class="info-row"><span class="label">Time Zone:</span> <span id="info-timezone">-</span></div>
      <div class="info-row"><span class="label">Business Hours:</span> <span id="info-hours">-</span></div>
    </div>

    <div id="clock">--:--:--</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="areacode.js"></script>
</body>
</html>
