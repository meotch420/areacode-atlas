<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Area Code Atlas</title>

  <link
    rel="stylesheet"
    href="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.css"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <section class="top-section">
    <div class="top-left">
      <header>
        <h1>Area Code Atlas</h1>
        <p>Navigate North America by Area Code</p>
      </header>

      <form class="search" id="searchForm">
        <input
          id="areaSearch"
          type="text"
          inputmode="numeric"
          maxlength="3"
          placeholder="Enter Area Code"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>

      <div class="status-message" id="statusMessage">
        Enter a 3-digit area code to search.
      </div>
    </div>

    <aside class="info-panel">
      <h2>Area Information</h2>

      <div class="info-row">
        <span>Area Code</span>
        <strong id="areaCodeValue">---</strong>
      </div>

      <div class="info-row">
        <span>City</span>
        <strong id="cityValue">---</strong>
      </div>

      <div class="info-row">
        <span>State / Province</span>
        <strong id="stateValue">---</strong>
      </div>

      <div class="info-row">
        <span>Country</span>
        <strong id="countryValue">---</strong>
      </div>

      <div class="info-row">
        <span>Time Zone</span>
        <strong id="timezoneValue">---</strong>
      </div>

      <div class="info-row">
        <span>Local Time</span>
        <strong id="selectedLocalTime">--:--:--</strong>
      </div>
    </aside>

    <section class="timezone-bar" id="timezoneBar"></section>
  </section>

  <main class="map-wrapper">
    <div id="map"></div>
    <div class="map-notice hidden" id="mapNotice"></div>
  </main>

  <script src="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.umd.min.js"></script>
  <script src="areacode.js"></script>
</body>
</html>
