<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IANA Timezone Layout</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #f4f6f8;
            font-family: sans-serif;
        }
        #map-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .timezone-line {
            fill: none;
            stroke: #ff5722;
            stroke-width: 1px;
            stroke-opacity: 0.8;
        }
        .land {
            fill: #cccccc;
            stroke: #ffffff;
            stroke-width: 0.5px;
        }
    </style>
</head>
<body>

<div id="map-container"></div>

<script>
    const width = 960;
    const height = 500;

    const svg = d3.select("#map-container")
        .append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("preserveAspectRatio", "xMidYMid meet")
        .style("max-width", "100%")
        .style("height", "auto");

    const projection = d3.geoEquirectangular()
        .scale(150)
        .translate([width / 2, height / 2]);

    const path = d3.geoPath().projection(projection);

    const tzDataUrl = 'https://raw.githubusercontent.com/evansiroky/timezone-boundary-builder/master/data/timezones.geojson';
    const worldDataUrl = 'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson';

    Promise.all([
        d3.json(worldDataUrl),
        d3.json(tzDataUrl)
    ]).then(function(data) {
        const worldGeo = data[0];
        const tzGeo = data[1];

        svg.append("g")
            .selectAll("path")
            .data(worldGeo.features)
            .enter()
            .append("path")
            .attr("class", "land")
            .attr("d", path);

        svg.append("g")
            .selectAll("path")
            .data(tzGeo.features)
            .enter()
            .append("path")
            .attr("class", "timezone-line")
            .attr("d", path)
            .append("title")
            .text(d => d.properties.tzid);

    }).catch(function(error) {
        console.error("Error loading the map data: ", error);
    });
</script>

</body>
</html>
